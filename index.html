<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Raksha Bandhan ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       MAIN GALLERY PAGE
       ========================= -->

  <section id="galleryPage" class="page">

    <div class="heading">
      <div class="sparkles">✦ ✧ ✦</div>

        Tap on your photo ✨
      </p>
    </div>


    <div class="brothers-gallery">

      <!-- 1 -->
      <div class="brother-card"
           onclick="showBrother(1)">

  <!-- =========================
       RAKHI PHOTO PAGE
       ========================= -->

  <section id="rakhiPage" class="page rakhi-page">

    <img id="rakhiPhoto"
         src=""
         alt="Raksha Bandhan">

    <div class="message">

      <h2>Happy Raksha Bandhan ❤️</h2>

      <p>
        Wishing you lots of happiness, success and love always ✨
      </p>

    </div>


    <button class="back-button"
            onclick="goBack()">
      ← Back to Photos
    </button>
