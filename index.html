<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Brothers ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         MAIN PAGE
         ========================= -->

    <main id="brothersPage">

        <header class="page-header">
            <div class="rakhi-icon">🪢</div>

            <h1>My Brothers ❤️</h1>

            <p>Tap a photo ✨</p>
        </header>


        <section class="brothers-grid">

            <!-- 1 -->
            <div class="brother-card" onclick="openBrother(0)">
                <img src="IMG_20260825_160153.jpg" alt="Brother 1">
                <p>Naveen</p>
            </div>

            <!-- 2 -->
            <div class="brother-card" onclick="openBrother(1)">
                <img src="IMG_20260825_155730.jpg" alt="Brother 2">
                
            </div>

            <!-- 3 -->
            <div class="brother-card" onclick="openBrother(2)">
                <img src="IMG_20260825_155654.jpg" alt="Brother 3">
            </div>

            <!-- 4 -->
            <div class="brother-card" onclick="openBrother(3)">
                <img src="IMG_20241016_151241.jpg" alt="Brother 4">
            </div>

            <!-- 5 -->
            <div class="brother-card" onclick="openBrother(4)">
                <img src="IMG_20260825_155714.jpg" alt="Brother 5">
            </div>

            <!-- 6 -->
            <div class="brother-card" onclick="openBrother(5)">
                <img src="IMG_20260825_155759.jpg" alt="Brother 6">
            </div>

            <!-- 7 -->
            <div class="brother-card" onclick="openBrother(6)">
                <img src="IMG_20260823_164054.jpg" alt="Brother 7">
            </div>

            <!-- 8 -->
            <div class="brother-card" onclick="openBrother(7)">
                <img src="IMG_20260823_164134.jpg" alt="Brother 8">
            </div>

            <!-- 9 -->
            <div class="brother-card" onclick="openBrother(8)">
                <img src="IMG-20230210-WA0004.jpg" alt="Brother 9">
            </div>

            <!-- 10 -->
            <div class="brother-card" onclick="openBrother(9)">
                <img src="IMG_20260823_164041.jpg" alt="Brother 10">
            </div>

        </section>

    </main>


    <!-- =========================
         RAKHI DETAIL PAGE
         THIS IS HIDDEN INITIALLY
         ========================= -->

    <section id="rakhiPage" class="rakhi-page">

        <div class="rakhi-content">

            <div class="small-rakhi">🪢 ❤️ 🪢</div>

            <img id="rakhiImage" src="" alt="Rakhi Photo" class="rakhi-photo">

            <h1>Happy Raksha Bandhan ❤️</h1>

            <p class="rakhi-message">
                Wishing you lots of happiness, love and success! ✨
            </p>

            <button class="back-button" onclick="goBack()">
                ← Back
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
